[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"

# Route /api/* to the Express-in-a-function handler, so the frontend's
# fetch('/api/...') calls work unmodified in production.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
